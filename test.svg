<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="540" height="280" font-family="Georgia, serif">

  <!-- sfondo pergamena -->
  <rect width="540" height="280" fill="#f5e6c8" rx="8"/>
  <rect x="5" y="5" width="530" height="270" fill="none" stroke="#8b1a1a" stroke-width="2.5" rx="6"/>

  <!-- miniatura ritratto a destra -->
  <clipPath id="ritratto-clip">
    <rect x="390" y="14" width="136" height="254" rx="4"/>
  </clipPath>
  <image href="https://raw.githubusercontent.com/nilo-gh/echo/main/korvac_ritratto.png"
         x="390" y="14" width="136" height="254"
         preserveAspectRatio="xMidYMid slice"
         clip-path="url(#ritratto-clip)"/>
  <rect x="390" y="14" width="136" height="254" fill="none" stroke="#8b1a1a" stroke-width="1.5" rx="4"/>

  <!-- nome -->
  <text x="200" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">🪶 Korvac</text>
  <!-- sottotitolo -->
  <text x="200" y="60" text-anchor="middle" font-size="13" font-style="italic" fill="#555">Umano · Ranger 5 · Neutrale Buono</text>

  <!-- linea rossa -->
  <line x1="20" y1="70" x2="375" y2="70" stroke="#8b1a1a" stroke-width="1.5"/>

  <!-- CA / PF / Velocità -->
  <text x="80"  y="90" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="bold">CA</text>
  <text x="80"  y="108" text-anchor="middle" font-size="16" fill="#1a1a1a">14</text>

  <text x="200" y="90" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="bold">PF</text>
  <text x="200" y="108" text-anchor="middle" font-size="16" fill="#1a1a1a">38</text>

  <text x="310" y="90" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="bold">VEL</text>
  <text x="310" y="108" text-anchor="middle" font-size="16" fill="#1a1a1a">9 m</text>

  <!-- linea rossa -->
  <line x1="20" y1="118" x2="375" y2="118" stroke="#8b1a1a" stroke-width="1"/>

  <!-- 6 caratteristiche -->
  <text x="40"  y="140" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">FOR</text>
  <text x="40"  y="156" text-anchor="middle" font-size="13" fill="#1a1a1a">12</text>
  <text x="40"  y="170" text-anchor="middle" font-size="11" fill="#555">(+1)</text>

  <text x="103" y="140" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">DES</text>
  <text x="103" y="156" text-anchor="middle" font-size="13" fill="#1a1a1a">17</text>
  <text x="103" y="170" text-anchor="middle" font-size="11" fill="#555">(+3)</text>

  <text x="166" y="140" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">COS</text>
  <text x="166" y="156" text-anchor="middle" font-size="13" fill="#1a1a1a">14</text>
  <text x="166" y="170" text-anchor="middle" font-size="11" fill="#555">(+2)</text>

  <text x="229" y="140" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">INT</text>
  <text x="229" y="156" text-anchor="middle" font-size="13" fill="#1a1a1a">10</text>
  <text x="229" y="170" text-anchor="middle" font-size="11" fill="#555">(+0)</text>

  <text x="292" y="140" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">SAG</text>
  <text x="292" y="156" text-anchor="middle" font-size="13" fill="#1a1a1a">15</text>
  <text x="292" y="170" text-anchor="middle" font-size="11" fill="#555">(+2)</text>

  <text x="355" y="140" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">CAR</text>
  <text x="355" y="156" text-anchor="middle" font-size="13" fill="#1a1a1a">8</text>
  <text x="355" y="170" text-anchor="middle" font-size="11" fill="#555">(-1)</text>

  <!-- linea rossa -->
  <line x1="20" y1="180" x2="375" y2="180" stroke="#8b1a1a" stroke-width="1"/>

  <!-- info testo -->
  <text x="25" y="200" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Tiro salvezza: </tspan>FOR +3 · DES +5</text>
  <text x="25" y="218" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Competenze: </tspan>Furtività +7 · Natura +4 · Percezione +4</text>
  <text x="25" y="236" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Dadi vita: </tspan>5d10 · <tspan font-weight="bold" fill="#8b1a1a">Bonus comp.: </tspan>+3</text>
  <text x="25" y="254" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Arma: </tspan>Arco lungo +6 · 1d8+3 perforanti</text>

</svg>
