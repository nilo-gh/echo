<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" font-family="Georgia, serif">

  <!-- sfondo pergamena -->
  <rect width="420" height="280" fill="#f5e6c8" rx="8"/>
  <rect x="5" y="5" width="410" height="270" fill="none" stroke="#8b1a1a" stroke-width="2.5" rx="6"/>

  <!-- nome -->
  <text x="210" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">🪶 Korvac</text>
  <!-- sottotitolo -->
  <text x="210" y="62" text-anchor="middle" font-size="13" font-style="italic" fill="#555">Umano · Ranger 5 · Neutrale Buono</text>

  <!-- linea rossa -->
  <line x1="20" y1="72" x2="400" y2="72" stroke="#8b1a1a" stroke-width="1.5"/>

  <!-- CA / PF / Velocità -->
  <text x="90"  y="92" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="bold">CA</text>
  <text x="90"  y="110" text-anchor="middle" font-size="16" fill="#1a1a1a">14</text>

  <text x="210" y="92" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="bold">PF</text>
  <text x="210" y="110" text-anchor="middle" font-size="16" fill="#1a1a1a">38</text>

  <text x="330" y="92" text-anchor="middle" font-size="11" fill="#8b1a1a" font-weight="bold">VEL</text>
  <text x="330" y="110" text-anchor="middle" font-size="16" fill="#1a1a1a">9 m</text>

  <!-- linea rossa -->
  <line x1="20" y1="120" x2="400" y2="120" stroke="#8b1a1a" stroke-width="1"/>

  <!-- 6 caratteristiche -->
  <text x="40"  y="142" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">FOR</text>
  <text x="40"  y="158" text-anchor="middle" font-size="13" fill="#1a1a1a">12</text>
  <text x="40"  y="172" text-anchor="middle" font-size="11" fill="#555">(+1)</text>

  <text x="110" y="142" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">DES</text>
  <text x="110" y="158" text-anchor="middle" font-size="13" fill="#1a1a1a">17</text>
  <text x="110" y="172" text-anchor="middle" font-size="11" fill="#555">(+3)</text>

  <text x="180" y="142" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">COS</text>
  <text x="180" y="158" text-anchor="middle" font-size="13" fill="#1a1a1a">14</text>
  <text x="180" y="172" text-anchor="middle" font-size="11" fill="#555">(+2)</text>

  <text x="250" y="142" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">INT</text>
  <text x="250" y="158" text-anchor="middle" font-size="13" fill="#1a1a1a">10</text>
  <text x="250" y="172" text-anchor="middle" font-size="11" fill="#555">(+0)</text>

  <text x="320" y="142" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">SAG</text>
  <text x="320" y="158" text-anchor="middle" font-size="13" fill="#1a1a1a">15</text>
  <text x="320" y="172" text-anchor="middle" font-size="11" fill="#555">(+2)</text>

  <text x="390" y="142" text-anchor="middle" font-size="10" fill="#8b1a1a" font-weight="bold">CAR</text>
  <text x="390" y="158" text-anchor="middle" font-size="13" fill="#1a1a1a">8</text>
  <text x="390" y="172" text-anchor="middle" font-size="11" fill="#555">(-1)</text>

  <!-- linea rossa -->
  <line x1="20" y1="182" x2="400" y2="182" stroke="#8b1a1a" stroke-width="1"/>

  <!-- info testo -->
  <text x="25" y="202" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Tiro salvezza: </tspan>FOR +3 · DES +5</text>
  <text x="25" y="220" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Competenze: </tspan>Furtività +7 · Natura +4 · Percezione +4</text>
  <text x="25" y="238" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Dadi vita: </tspan>5d10 · <tspan font-weight="bold" fill="#8b1a1a">Bonus comp.: </tspan>+3</text>
  <text x="25" y="256" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#8b1a1a">Arma: </tspan>Arco lungo +6 · 1d8+3 perforanti</text>

</svg>
